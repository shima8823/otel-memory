receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  tail_sampling:
    decision_wait: 30s
    num_traces: 100000
    expected_new_traces_per_sec: 10000
    policies:
      # すべてのトレースをサンプリング（100%）
      - name: always-sample
        type: always_sample

  batch:
    send_batch_size: 2048
    timeout: 1s

exporters:
  prometheus:
    endpoint: 0.0.0.0:9090
    namespace: testapp

  debug:
    verbosity: basic

extensions:
  pprof:
    endpoint: 0.0.0.0:1777

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
  extensions: [pprof]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [debug]
