# tail-sampling.yaml との比較実験用の最適化シナリオ
#
# 差分は decision_wait のみ:
#   - tail-sampling.yaml: 30s
#   - tail-sampling-optimized.yaml: 10s
#
# 目的:
#   - decision_wait 短縮によるメモリ削減効果を実測する

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # memory_limiter は tail_sampling の前に配置（ベストプラクティス）
  # ただし、tail_sampling の内部バッファは memory_limiter では制御できない
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Tail Sampling Processor
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/tailsamplingprocessor
  #
  # 最適化設定（tail-sampling.yaml からの変更点）:
  # - decision_wait: 10s（30s から短縮 — 唯一の差分）
  # - num_traces: 1000000（変更なし）
  # - expected_new_traces_per_sec: 10000（変更なし）
  tail_sampling:
    decision_wait: 10s
    num_traces: 1000000
    expected_new_traces_per_sec: 10000
    policies:
      # すべてのトレースをサンプリング（100%）
      # 実際の運用では確率サンプリングやレイテンシベースを使用
      - name: always-sample
        type: always_sample

exporters:
  otlp:
    endpoint: jaeger:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true

  prometheus:
    endpoint: 0.0.0.0:9090
    namespace: testapp

  debug:
    verbosity: basic

extensions:
  pprof:
    endpoint: 0.0.0.0:1777

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
  extensions: [pprof]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling]
      exporters: [otlp, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [debug]
