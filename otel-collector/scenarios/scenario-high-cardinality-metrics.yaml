# 高カーディナリティメトリクス シナリオ（Prometheus scrape 方式）
#
# アーキテクチャ:
#   [Loadgen VM]                         [Collector VM]
#     HTTP :9091 /metrics          ←── prometheus receiver (scrape)
#     (stateless: 毎回テキスト生成)         ↓
#                                      memory_limiter, batch
#                                         ↓
#                                      prometheus exporter (時系列蓄積 → OOM)
#
# メモリ膨張のメカニズム:
#   1. loadgen が /metrics で毎回ユニークなラベル（uuid）付きメトリクスを返す
#   2. prometheus receiver が 2秒ごとに scrape
#   3. prometheus exporter が全時系列をメモリに保持（metric_expiration: 0s）
#   4. 120 scrape × 5000 series/scrape = 600,000 ユニーク時系列 → メモリ膨張
#
# なぜこの方式か:
#   - loadgen は完全に stateless（OOM しない）
#   - Collector 側の prometheus exporter がメモリ消費の主犯（意図通り）
#   - 実務で最も一般的な高カーディナリティパターン（Prometheus エコシステム全般）

receivers:
  # prometheus receiver: loadgen の /metrics を scrape
  prometheus:
    config:
      scrape_configs:
        - job_name: 'high-cardinality-loadgen'
          scrape_interval: 2s
          static_configs:
            - targets: ['LOADGEN_IP:9091']

processors:
  memory_limiter:
    check_interval: 200ms
    limit_percentage: 80
    spike_limit_percentage: 20

  batch:
    send_batch_size: 1000
    send_batch_max_size: 2000
    timeout: 200ms

exporters:
  # prometheus exporter がメモリ消費の主犯
  # 受け取った全時系列をメモリに保持してスクレイプに備える
  prometheus:
    endpoint: 0.0.0.0:9090
    namespace: loadgen
    metric_expiration: 0s

extensions:
  pprof:
    endpoint: 0.0.0.0:1777

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
  extensions: [pprof]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
