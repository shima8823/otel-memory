# 高カーディナリティ spanmetrics シナリオ（最適化版）
#
# 問題版との違い:
#   dimensions から高カーディナリティ属性 (attr_0, attr_1) を除外し、
#   低カーディナリティ属性 (attr_2, attr_3, attr_4) のみ残す
#
# 期待される挙動:
#   - 同じ負荷（1300 traces/sec, 8属性, depth 5）を与えても
#   - dimensions の組み合わせ数が 20 × 10 × 5 = 1,000 に抑えられる
#   - 内部マップのサイズが安定 → memory_limiter が発火しない
#
# 教訓:
#   個々の属性のカーディナリティを確認し、掛け算の結果を見積もること
#   高カーディナリティ属性を dimensions から外すだけで解消される
#
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # memory_limiter
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

connectors:
  # spanmetrics connector
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/connector/spanmetricsconnector
  # 最適化版: 高カーディナリティ属性 (attr_0, attr_1) を dimensions から除外
  # 低カーディナリティ属性 (attr_2, attr_3, attr_4) のみ残す
  # 組み合わせ数: 20 × 10 × 5 = 1,000（有界）
  spanmetrics:
    histogram:
      explicit:
        buckets: [1ms, 5ms, 10ms, 50ms, 100ms, 500ms, 1s, 5s]
    dimensions:
      - name: attr_2    # deployment version 相当 (20種類)
      - name: attr_3    # client region 相当 (10種類)
      - name: attr_4    # HTTP method 相当 (5種類)
    aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE

exporters:
  debug:
    verbosity: basic

extensions:
  pprof:
    endpoint: 0.0.0.0:1777

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
  extensions: [pprof]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [spanmetrics, debug]
    metrics:
      receivers: [spanmetrics]
      processors: [memory_limiter]
      exporters: [debug]
