# 高カーディナリティ spanmetrics シナリオ
#
# アーキテクチャ:
#   [Loadgen VM]                         [Collector VM]
#     pyloadgen (traces)           →     otlp receiver
#     attr_0〜attr_7 に UUID              ↓
#                                      memory_limiter, batch
#                                         ↓
#                                      spanmetrics connector (内部マップ膨張 → OOM)
#                                         ↓
#                                      debug exporter
#
# メモリ膨張のメカニズム:
#   1. loadgen が各スパンに 8 個の UUID 属性を付与して送信
#   2. spanmetrics connector が dimension ごとにメトリクス時系列を生成
#   3. CUMULATIVE temporality のため、全ユニーク組み合わせを内部マップに永久保持
#   4. 内部マップが無限膨張 → memory_limiter 発火 → データドロップ
#
# 単因子性の確保:
#   - Jaeger exporter (sending_queue) を除外 → キュー滞留によるメモリ消費を排除
#   - Prometheus exporter を除外 → メトリクスの二重保持を排除
#   - spanmetrics の内部マップが唯一のメモリ消費源
#
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # memory_limiter
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # batch
  batch:
    send_batch_size: 2000
    send_batch_max_size: 4000
    timeout: 200ms

connectors:
  # spanmetrics connector
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/connector/spanmetricsconnector
  # 高カーディナリティ属性を dimension に含めることで、メトリクス時系列が爆発的に増加
  # これにより内部マップが膨張し、メモリを消費し続ける
  spanmetrics:
    histogram:
      explicit:
        buckets: [1ms, 5ms, 10ms, 50ms, 100ms, 500ms, 1s, 5s]
    # 高カーディナリティ属性を dimension に含める
    # loadgen の -high-cardinality フラグで、attr_0〜attr_7 の値に UUID が含まれる
    dimensions:
      - name: attr_0
      - name: attr_1
      - name: attr_2
      - name: attr_3
      - name: attr_4
      - name: attr_5
      - name: attr_6
      - name: attr_7
    # 時系列の期限切れを無効化（メモリに保持し続ける）
    dimensions_cache_size: 10000000
    aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE

exporters:
  debug:
    verbosity: basic

extensions:
  pprof:
    endpoint: 0.0.0.0:1777

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
  extensions: [pprof]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [spanmetrics, debug]
    metrics:
      receivers: [spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [debug]
